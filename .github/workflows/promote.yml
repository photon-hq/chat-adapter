name: Promote to production

on:
  workflow_dispatch:
    inputs:
      staging_version:
        type: string
        default: ""
        description: Staging version to promote (blank promotes the current staging tag)

permissions:
  contents: read

jobs:
  promote:
    uses: photon-hq/buildspace/.github/workflows/package-promote.yml@c1fb06e4ae457a8e053642a914bd37b8f5ce9e1b
    permissions:
      contents: write
      packages: read
      actions: read
      attestations: read
      id-token: write
    with:
      registry: https://registry.npmjs.org
      package: "@photon-ai/chat-adapter"
      staging-version: ${{ inputs.staging_version }}
